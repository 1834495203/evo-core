[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-core"
version = "0.1.0"
description = "Minimal self-contained autonomous scientific research kernel with pluggable modules"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "psutil>=6.0",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.0,<2"]
tracking = ["mlflow>=3,<4"]

[project.scripts]
evocore = "evo_core.cli:main"

[tool.setuptools.packages.find]
include = ["evo_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
